<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moodboard · Creator Scout</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="moodboard.css">
</head>
<body>
  <nav class="top">
    <div class="brandmark">
      <a class="mark" href="#" id="home-link"><svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3.6" y="9.5" width="8" height="14" rx="2" transform="rotate(-16 7.6 16.5)" fill="#EDEDED" fill-opacity="0.5"/><rect x="20.4" y="9.5" width="8" height="14" rx="2" transform="rotate(16 24.4 16.5)" fill="#EDEDED" fill-opacity="0.5"/><rect x="10.75" y="5.5" width="10.5" height="19" rx="2.6" fill="#A6FF3D"/><path d="M14.4 11.6 L19.2 15 L14.4 18.4 Z" fill="#000"/></svg><span>Creator Scout</span></a>
      <span id="sync-state" class="sync-state"></span>
    </div>
    <div class="top-actions">
      <button id="update-btn" class="ghost-btn update-btn hidden" title="A new version of Creator Scout is ready">Update available</button>
      <button id="new-brand" class="ghost-btn">New brand</button>
      <a class="ghost-btn" href="sheet.html">Open sheet</a>
      <div class="pop-anchor">
        <button id="more-btn" class="ghost-btn icon-btn" aria-haspopup="true" aria-label="More">···</button>
        <div id="more-pop" class="menu-pop hidden" role="menu">
          <button id="sample-btn" role="menuitem">Load sample board</button>
          <button id="copy-links" role="menuitem">Copy links in this view</button>
        </div>
      </div>
    </div>
  </nav>

  <header class="hero">
    <button id="back" class="back hidden">← All brands</button>
    <div class="title-row">
      <h1 id="title" class="title"></h1>
      <div id="brand-actions" class="brand-actions hidden">
        <button id="edit-card" class="ghost-btn">Edit card</button>
      </div>
    </div>
    <p id="sub" class="sub"></p>
    <div class="search-row">
      <label class="search glow-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search brands, creators, captions" aria-label="Search" autocomplete="off">
      </label>
      <div id="view-tabs" class="seg view-tabs hidden" role="tablist">
        <button data-tab="reels" class="on" role="tab">Reels <span id="count-reels"></span></button>
        <button data-tab="creators" role="tab">Creators <span id="count-creators"></span></button>
      </div>
    </div>
    <div class="controls-row">
      <div id="filters" class="filters"></div>
      <div id="reel-tools" class="reel-tools hidden">
        <div class="pop-anchor">
          <button id="filters-btn" class="ghost-btn filters-btn" aria-haspopup="true">Filters</button>
          <div id="filters-pop" class="filters-pop hidden" role="dialog" aria-label="Filters"></div>
        </div>
        <button id="add-links-btn" class="ghost-btn">+ Add reel links</button>
        <div id="layout-toggle" class="seg" role="group" aria-label="Layout">
          <button data-layout="carousel" class="on">Carousel</button>
          <button data-layout="grid">Grid</button>
        </div>
      </div>
    </div>
    <form id="add-links" class="add-links hidden">
      <textarea id="links-input" rows="4" placeholder="Paste Instagram or YouTube links, one per line&#10;https://www.instagram.com/reel/…&#10;https://youtube.com/shorts/…"></textarea>
      <div class="add-row">
        <input id="links-niche" list="links-niches" placeholder="Niche (optional)" autocomplete="off">
        <datalist id="links-niches"></datalist>
        <button type="submit" id="links-submit" class="glow-pill add-submit">Add to board</button>
      </div>
      <p id="links-progress" class="links-progress"></p>
    </form>
  </header>

  <section id="stage" class="stage" aria-roledescription="carousel">
    <div class="halo" aria-hidden="true"></div>
    <button class="arrow prev" id="prev" aria-label="Previous">←</button>
    <div id="ring" class="ring"></div>
    <button class="arrow next" id="next" aria-label="Next">→</button>
    <p id="counter" class="counter"></p>
  </section>

  <section id="grid" class="grid hidden"></section>
  <section id="creators" class="creators hidden"></section>
  <section id="info" class="info"></section>

  <!-- Brand card editor -->
  <div id="brand-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="bm-title">
    <form id="bm-form" class="modal-box">
      <h2 id="bm-title" class="modal-title">Edit card</h2>
      <div class="bm-body">
        <div class="bm-preview"><div id="bm-card" class="card preview-card active" tabindex="0" aria-label="Card preview. Drag or use the arrow keys to move the image."></div></div>
        <div class="bm-fields">
          <label class="fld">Brand name
            <input id="bm-name" type="text" autocomplete="off" placeholder="e.g. Nykaa">
          </label>
          <div class="fld">Logo
            <div class="logo-row">
              <label class="ghost-btn file-btn">Upload image<input id="bm-logo" type="file" accept="image/*" hidden></label>
              <button type="button" id="bm-logo-clear" class="link-btn">Remove</button>
            </div>
            <div id="bm-crop" class="crop hidden">
              <div class="zoom-row">
                <button type="button" class="zoom-step" data-step="-1" aria-label="Zoom out">−</button>
                <input id="bm-zoom" type="range" min="0" max="1000" step="1" aria-label="Image size">
                <button type="button" class="zoom-step" data-step="1" aria-label="Zoom in">+</button>
              </div>
              <div class="crop-presets">
                <button type="button" data-preset="logo">Logo size</button>
                <button type="button" data-preset="fit">Whole image</button>
                <button type="button" data-preset="fill">Fill card</button>
              </div>
              <span class="hint">Drag the image on the card to move it. Scroll on the card to zoom.</span>
            </div>
            <span id="bm-logo-hint" class="hint">A logo PNG with a transparent background, or any photo.</span>
          </div>
          <div class="fld">Card colour
            <div id="bm-swatches" class="swatches"></div>
          </div>
        </div>
      </div>
      <div id="bm-danger" class="danger-zone hidden">
        <div>
          <p class="dz-title">Delete this brand</p>
          <p class="dz-text">Removes the brand card and everything filed under it, for the whole team.</p>
        </div>
        <button type="button" id="bm-delete" class="danger-btn">Delete brand</button>
      </div>
      <p id="bm-error" class="modal-error"></p>
      <div class="modal-actions">
        <button type="button" id="bm-cancel" class="ghost-btn">Cancel</button>
        <button type="submit" id="bm-save" class="glow-pill modal-save">Save card</button>
      </div>
    </form>
  </div>

  <!-- Confirm dialog (simple, or type-the-name for brands) -->
  <div id="confirm" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" aria-describedby="cf-text">
    <form id="cf-form" class="modal-box confirm-box">
      <h2 id="cf-title" class="modal-title"></h2>
      <div id="cf-text" class="cf-text"></div>
      <label id="cf-type-wrap" class="fld hidden"><span id="cf-type-label"></span>
        <input id="cf-type" type="text" autocomplete="off" spellcheck="false">
      </label>
      <div class="modal-actions">
        <button type="button" id="cf-cancel" class="ghost-btn">Cancel</button>
        <button type="submit" id="cf-ok" class="danger-btn">Delete</button>
      </div>
    </form>
  </div>

  <!-- Reel player -->
  <div id="player" class="modal hidden" role="dialog" aria-modal="true" aria-label="Reel player">
    <div class="player-box">
      <button id="player-close" class="player-close" aria-label="Close">×</button>
      <button id="player-prev" class="arrow pl-prev" aria-label="Previous">←</button>
      <div id="player-frame" class="player-frame"></div>
      <div id="player-side" class="player-side"></div>
      <button id="player-next" class="arrow pl-next" aria-label="Next">→</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="updater.js"></script>
  <script src="db.js"></script>
  <script src="platforms.js"></script>
  <script src="moodboard.js"></script>
</body>
</html>
