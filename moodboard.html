<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moodboard · Creator Scout</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="moodboard.css">
</head>
<body>
  <nav class="top">
    <a class="mark" href="#" id="home-link"><span class="dot"></span>Creator Scout</a>
    <div class="top-actions">
      <div id="layout-toggle" class="seg hidden" role="group" aria-label="Layout">
        <button data-layout="carousel" class="on">Carousel</button>
        <button data-layout="grid">Grid</button>
      </div>
      <button id="copy-links" class="ghost-btn">Copy links</button>
      <a class="ghost-btn" href="sheet.html">Open sheet</a>
    </div>
  </nav>

  <header class="hero">
    <button id="back" class="back hidden">← All brands</button>
    <h1 id="title" class="title"></h1>
    <p id="sub" class="sub"></p>
    <label class="search glow-pill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search brands, creators, captions" aria-label="Search" autocomplete="off">
    </label>
    <div id="filters" class="filters"></div>
  </header>

  <section id="stage" class="stage" aria-roledescription="carousel">
    <div class="halo" aria-hidden="true"></div>
    <button class="arrow prev" id="prev" aria-label="Previous">←</button>
    <div id="ring" class="ring"></div>
    <button class="arrow next" id="next" aria-label="Next">→</button>
    <p id="counter" class="counter"></p>
  </section>

  <section id="grid" class="grid hidden"></section>

  <section id="info" class="info"></section>

  <div id="toast" class="toast" role="status"></div>

  <script src="db.js"></script>
  <script src="moodboard.js"></script>
</body>
</html>
