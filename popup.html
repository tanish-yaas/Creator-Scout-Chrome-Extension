<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g class="logo-ink" transform="translate(13.9 16) scale(0.23)" fill="#E3F0FF"><path d="M20,-64 Q-6,-26 -34,8 Q-12,4 4,6 Q-6,34 -20,64 Q8,26 36,-10 Q16,-8 0,-8 Q8,-36 20,-64Z"/><path transform="translate(38 -46)" d="M0,-14 C2,-3 3,-2 14,0 C3,2 2,3 0,14 C-2,3 -3,2 -14,0 C-3,-2 -2,-3 0,-14Z"/></g></svg>
        <span class="brand-name">Creator Scout</span>
        <span id="status-dot" class="brand-dot"></span>
      </div>
      <div class="top-right">
        <button id="mode-btn" class="mode-btn" role="switch" aria-checked="false" title="Moodboard mode: saves go to the team moodboard">
          <span class="mode-knob" aria-hidden="true"></span>Moodboard mode
        </button>
        <button id="open-moodboard" class="ghost icon" title="Open the moodboard in a new tab" aria-label="Open the moodboard">↗</button>
      </div>
    </header>

    <button id="update-bar" class="update-bar hidden">
      <span id="update-text">A new version is ready</span><span class="update-go">Update</span>
    </button>


    <!-- ================= SCOUT ================= -->
    <main id="view-scout" class="view">
      <div class="fetch-row">
        <div class="seg">
          <button id="toggle-ig" class="active">Instagram</button>
          <button id="toggle-yt">YouTube</button>
        </div>
        <button id="fetch-btn" class="fetch">Fetch page</button>
      </div>

      <section id="preview-empty" class="empty-card">
        <p class="pixel">Nothing fetched yet</p>
        <p>Open a profile, channel, reel, post, short or video, then click Fetch page.</p>
      </section>

      <section id="preview" class="card hidden">
        <div id="content-preview" class="content hidden">
          <div class="thumb">
            <img id="prev-thumb" alt="">
          </div>
          <div class="content-meta">
            <span id="prev-content-kind" class="kind">Reel</span>
            <p id="prev-caption" class="caption"></p>
            <p id="prev-content-stats" class="stats-line"></p>
          </div>
        </div>

        <div class="who">
          <p id="prev-handle" class="handle pixel">--</p>
          <p id="prev-name" class="name">--</p>
        </div>
        <div class="stats">
          <div><span class="k" id="label-followers">Followers</span><span class="v" id="prev-followers">--</span></div>
          <div><span class="k">Tier</span><span class="v"><span class="tier" id="prev-tier">--</span></span></div>
          <div class="ig-only"><span class="k">Category</span><span class="v" id="prev-category">--</span></div>
          <div class="yt-only hidden"><span class="k">Avg views (10)</span><span class="v" id="prev-views">--</span></div>
        </div>
      </section>

      <section class="fields">
        <div class="row">
          <div class="field" style="flex: 3;">
            <label for="creator-type">Type</label>
            <select id="creator-type">
              <option value="Beauty">Beauty</option>
              <option value="Business & Finance">Business & Finance</option>
              <option value="Cinematographer / Photographer">Cinematographer / Photographer</option>
              <option value="Comedy & Memes">Comedy & Memes</option>
              <option value="Dance">Dance</option>
              <option value="Education">Education</option>
              <option value="Fashion">Fashion</option>
              <option value="Fitness">Fitness</option>
              <option value="Food">Food</option>
              <option value="Gaming">Gaming</option>
              <option value="Lifestyle & Vlogs">Lifestyle & Vlogs</option>
              <option value="Motivation & Self-help">Motivation & Self-help</option>
              <option value="Music">Music</option>
              <option value="News & Commentary">News & Commentary</option>
              <option value="Tech & Gadgets">Tech & Gadgets</option>
              <option value="Travel">Travel</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div class="field" style="flex: 2; position: relative;">
            <label for="mb-brand">Brand</label>
            <input type="text" id="mb-brand" placeholder="e.g. Nykaa" autocomplete="off">
            <ul id="brand-dropdown" class="dropdown hidden"></ul>
          </div>
        </div>
        <input type="text" id="custom-type" class="hidden" placeholder="Enter a custom type">

        <div id="moodboard-fields" class="hidden">
          <div class="field" style="position: relative;">
            <label for="mb-niche">Niche</label>
            <input type="text" id="mb-niche" placeholder="e.g. GRWM, unboxing" autocomplete="off">
            <ul id="niche-dropdown" class="dropdown hidden"></ul>
          </div>
          <div class="field">
            <label>Campaign type</label>
            <div id="festive-chips" class="chips"></div>
          </div>
        </div>
      </section>

      <button id="send-btn" class="cta glow-pill">Save to sheet</button>

      <button id="open-sheet" class="sheet-row">
        <span class="sheet-label">Open sheet</span>
        <span id="sheet-count" class="sheet-count">0 creators</span>
      </button>
    </main>

    <footer>
      <p id="status-msg">Ready</p>
      <p class="whoami"><span id="team-state" class="team-state"></span><button id="who-btn" class="who-link"></button></p>
      <form id="who-form" class="who-form hidden">
        <input type="text" id="who-input" placeholder="Your name, shown on the team board" autocomplete="off">
        <button type="submit" class="ghost">Save</button>
      </form>
    </footer>
  </div>
  <script src="config.js"></script>
  <script src="updater.js"></script>
  <script src="db.js"></script>
  <script src="platforms.js"></script>
  <script src="scraper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
